<svg xmlns="http://www.w3.org/2000/svg" width="960" height="375" viewBox="0 0 960 375"><rect width="100%" height="100%" rx="14" fill="#111827"/><rect width="100%" height="46" rx="14" fill="#1f2937"/><circle cx="24" cy="23" r="6" fill="#f87171"/><circle cx="44" cy="23" r="6" fill="#fbbf24"/><circle cx="64" cy="23" r="6" fill="#34d399"/><text x="88" y="29" font-family="Arial,sans-serif" font-size="15" fill="#e5e7eb">Minikube status — illustrative output</text><text x="28" y="82" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">$ minikube status</text><text x="28" y="107" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">minikube</text><text x="28" y="132" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">type: Control Plane</text><text x="28" y="157" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">host: Running</text><text x="28" y="182" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">kubelet: Running</text><text x="28" y="207" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">apiserver: Running</text><text x="28" y="232" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">kubeconfig: Configured</text><text x="28" y="257" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9"></text><text x="28" y="282" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">$ kubectl get nodes</text><text x="28" y="307" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">NAME       STATUS   ROLES           AGE   VERSION</text><text x="28" y="332" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">minikube   Ready    control-plane   2m    v1.xx.x</text><text x="28" y="359" font-family="Arial,sans-serif" font-size="12" fill="#9ca3af">Mock terminal example; actual names, ages and versions will differ.</text></svg>