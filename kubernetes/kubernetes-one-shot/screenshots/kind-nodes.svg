<svg xmlns="http://www.w3.org/2000/svg" width="960" height="425" viewBox="0 0 960 425"><rect width="100%" height="100%" rx="14" fill="#111827"/><rect width="100%" height="46" rx="14" fill="#1f2937"/><circle cx="24" cy="23" r="6" fill="#f87171"/><circle cx="44" cy="23" r="6" fill="#fbbf24"/><circle cx="64" cy="23" r="6" fill="#34d399"/><text x="88" y="29" font-family="Arial,sans-serif" font-size="15" fill="#e5e7eb">Kind cluster nodes — illustrative output</text><text x="28" y="82" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">$ kind create cluster --name dev-cluster</text><text x="28" y="107" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">Creating cluster &quot;dev-cluster&quot; ...</text><text x="28" y="132" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9"> ✓ Ensuring node image (kindest/node) 🖼</text><text x="28" y="157" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9"> ✓ Preparing nodes 📦</text><text x="28" y="182" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9"> ✓ Writing configuration 📜</text><text x="28" y="207" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9"> ✓ Starting control-plane 🕹️</text><text x="28" y="232" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">Set kubectl context to &quot;kind-dev-cluster&quot;</text><text x="28" y="257" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">You can now use your cluster with:</text><text x="28" y="282" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">kubectl cluster-info --context kind-dev-cluster</text><text x="28" y="307" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9"></text><text x="28" y="332" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">$ kubectl get nodes</text><text x="28" y="357" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">NAME                          STATUS   ROLES           AGE   VERSION</text><text x="28" y="382" font-family="Consolas,Menlo,monospace" font-size="17" fill="#d8dee9">dev-cluster-control-plane     Ready    control-plane   40s   v1.xx.x</text><text x="28" y="409" font-family="Arial,sans-serif" font-size="12" fill="#9ca3af">Mock terminal example; actual names, ages and versions will differ.</text></svg>